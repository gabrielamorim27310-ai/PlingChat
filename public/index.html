<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nexus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⬢</text></svg>">
</head>
<body>

<!-- ------------------------------------------------------------- login -->
<div id="auth" class="auth">
  <div class="auth-bg"></div>
  <div class="auth-card">
    <div class="auth-brand"><span class="logo">⬢</span> Nexus</div>
    <h1 id="authTitle">Que bom te ver de novo!</h1>
    <p class="auth-sub" id="authSub">Entre para conversar, chamar e jogar com a galera.</p>

    <form id="authForm" autocomplete="on">
      <label class="field" id="fieldUsername" hidden>
        <span>Nome de usuário</span>
        <input name="username" type="text" maxlength="32" autocomplete="nickname">
      </label>
      <label class="field">
        <span>E-mail</span>
        <input name="email" type="email" required autocomplete="email">
      </label>
      <label class="field">
        <span>Senha</span>
        <input name="password" type="password" required minlength="6" autocomplete="current-password">
      </label>
      <p class="auth-error" id="authError" hidden></p>
      <button class="btn btn-primary btn-block" id="authSubmit" type="submit">Entrar</button>
    </form>

    <p class="auth-switch">
      <span id="authSwitchText">Precisa de uma conta?</span>
      <button type="button" id="authSwitch" class="link">Registre-se</button>
    </p>
  </div>
</div>

<!-- --------------------------------------------------------------- app -->
<div id="app" class="app" hidden>

  <!-- barra de servidores -->
  <nav class="rail">
    <button class="rail-item rail-home active" id="railHome" title="Mensagens diretas">
      <span class="rail-glyph">⬢</span>
      <span class="rail-pill"></span>
    </button>
    <div class="rail-sep"></div>
    <div id="railGuilds" class="rail-guilds"></div>
    <button class="rail-item rail-add" id="btnCreateGuild" title="Criar servidor">+</button>
    <button class="rail-item rail-join" id="btnJoinGuild" title="Entrar em um servidor">🧭</button>
  </nav>

  <!-- barra lateral -->
  <aside class="sidebar">
    <header class="sidebar-header" id="sidebarHeader">
      <span id="sidebarTitle">Mensagens diretas</span>
      <span class="chev" id="guildMenuChevron" hidden>⌄</span>
    </header>

    <div class="sidebar-body" id="sidebarBody"></div>

    <!-- painel de voz ativo -->
    <div class="voice-panel" id="voicePanel" hidden>
      <div class="voice-info">
        <div class="voice-status"><span class="dot"></span> <span id="voiceStatusText">Conectado</span></div>
        <div class="voice-channel" id="voiceChannelName"></div>
      </div>
      <div class="voice-actions">
        <button class="icon-btn" id="btnScreen" title="Compartilhar tela">🖥️</button>
        <button class="icon-btn" id="btnCam" title="Câmera">📷</button>
        <button class="icon-btn danger" id="btnHangup" title="Desconectar">📞</button>
      </div>
    </div>

    <!-- painel do usuário -->
    <div class="user-panel">
      <button class="user-info" id="btnUserSettings">
        <span class="avatar" id="meAvatar"></span>
        <span class="user-text">
          <strong id="meName">—</strong>
          <small id="meTag">#0000</small>
        </span>
      </button>
      <div class="user-actions">
        <button class="icon-btn" id="btnMic" title="Microfone">🎙️</button>
        <button class="icon-btn" id="btnDeaf" title="Áudio">🎧</button>
        <button class="icon-btn" id="btnSettings" title="Configurações">⚙️</button>
      </div>
    </div>
  </aside>

  <!-- área principal -->
  <main class="main">
    <header class="chat-header">
      <button class="icon-btn only-mobile" id="btnBack">‹</button>
      <span class="chat-title" id="chatTitle">Início</span>
      <span class="chat-topic" id="chatTopic"></span>
      <div class="chat-actions">
        <button class="icon-btn" id="btnCall" title="Chamada de voz" hidden>📞</button>
        <button class="icon-btn" id="btnVideoCall" title="Chamada de vídeo" hidden>🎥</button>
        <button class="icon-btn" id="btnBotPanel" title="Painel do bot" hidden>🤖</button>
        <button class="icon-btn" id="btnMembers" title="Membros" hidden>👥</button>
      </div>
    </header>

    <!-- palco de vídeo/tela -->
    <section class="stage" id="stage" hidden>
      <div class="stage-grid" id="stageGrid"></div>
      <div class="stage-bar">
        <button class="pill-btn" id="stageMic">🎙️ Mudo</button>
        <button class="pill-btn" id="stageCam">📷 Câmera</button>
        <button class="pill-btn" id="stageScreen">🖥️ Tela</button>
        <button class="pill-btn danger" id="stageLeave">Sair</button>
        <button class="pill-btn ghost" id="stageCollapse">Ocultar</button>
      </div>
    </section>

    <div class="content" id="content">
      <div class="messages" id="messages"></div>
      <div class="typing" id="typing"></div>
      <form class="composer" id="composer" hidden>
        <div class="reply-bar" id="replyBar" hidden>
          <span id="replyText"></span>
          <button type="button" class="icon-btn" id="replyCancel">✕</button>
        </div>
        <div class="composer-row">
          <button type="button" class="icon-btn" id="btnEmoji">😊</button>
          <textarea id="input" rows="1" placeholder="Conversar" maxlength="4000"></textarea>
          <button type="submit" class="icon-btn send" title="Enviar">➤</button>
        </div>
      </form>
    </div>
  </main>

  <!-- membros -->
  <aside class="members" id="membersPane" hidden>
    <div id="membersList"></div>
  </aside>
</div>

<!-- áudio remoto (voz) -->
<div id="audioSink" hidden></div>

<!-- --------------------------------------------------------- modais -->
<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal" id="modal"></div>
</div>

<!-- chamada recebida -->
<div class="ring" id="ringOverlay" hidden>
  <div class="ring-card">
    <span class="avatar big" id="ringAvatar"></span>
    <h2 id="ringName">—</h2>
    <p id="ringKind">Chamada de voz</p>
    <div class="ring-actions">
      <button class="btn btn-danger" id="ringDecline">Recusar</button>
      <button class="btn btn-success" id="ringAccept">Atender</button>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script src="/socket.io/socket.io.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
