<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Escolher tela ou janela</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #10131a; color: #e6e9f0; font-family: system-ui, sans-serif; }
  h1 { font-size: 15px; padding: 16px 16px 4px; font-weight: 700; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; padding: 16px; overflow-y: auto; height: calc(100% - 90px); }
  .item { cursor: pointer; border: 2px solid transparent; border-radius: 10px; overflow: hidden; background: #1d222d; text-align: left; }
  .item:hover { border-color: #5865f2; }
  .item img { width: 100%; height: 96px; object-fit: contain; background: #06070a; display: block; }
  .item span { display: block; padding: 8px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .foot { padding: 12px 16px; text-align: right; }
  button.cancel { background: #262c39; color: #e6e9f0; border: 0; border-radius: 8px; padding: 9px 16px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<h1>Qual tela ou janela você quer compartilhar?</h1>
<div class="grid" id="grid"></div>
<div class="foot"><button class="cancel" id="cancel">Cancelar</button></div>
<script>
  const grid = document.getElementById('grid');
  document.getElementById('cancel').onclick = () => window.picker.cancel();

  window.picker.getSources().then((sources) => {
    for (const s of sources) {
      const btn = document.createElement('button');
      btn.className = 'item';
      btn.innerHTML = `<img src="${s.thumbnail}"><span>${s.name}</span>`;
      btn.onclick = () => window.picker.choose(s.id);
      grid.append(btn);
    }
  });
</script>
</body>
</html>
