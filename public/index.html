<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PlingChat</title>
<meta name="nexus-api" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>try { document.documentElement.dataset.theme = localStorage.getItem('nexus.theme') || 'dark'; } catch (e) {}</script>
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%239b4dff'/><stop offset='1' stop-color='%23d94fc0'/></linearGradient></defs><rect width='24' height='24' rx='6.7' fill='url(%23g)'/><path d='M21 11.5a8.4 8.4 0 0 1-9 8.4 9.5 9.5 0 0 1-2.8-.4L4 21l1.4-4.1A8.2 8.2 0 0 1 3.6 11.5C3.6 6.9 7.6 3.2 12.5 3.2S21 6.9 21 11.5Z' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<!-- PWA: instalável na tela de início -- no iPhone é a ÚNICA forma de
     notificação do sistema funcionar (Safari sozinho não permite). -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#08080b">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PlingChat">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>

<!-- ----------------------------------------------------------- loading -->
<div id="loading" class="loading">
  <span class="brand-mark logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.5 9.5 0 0 1-2.8-.4L4 21l1.4-4.1A8.2 8.2 0 0 1 3.6 11.5C3.6 6.9 7.6 3.2 12.5 3.2S21 6.9 21 11.5Z"></path></svg></span>
</div>

<!-- ------------------------------------------------------------- login -->
<div id="auth" class="auth" hidden>
  <div class="auth-bg"></div>
  <div class="auth-card">
    <div class="auth-brand"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.5 9.5 0 0 1-2.8-.4L4 21l1.4-4.1A8.2 8.2 0 0 1 3.6 11.5C3.6 6.9 7.6 3.2 12.5 3.2S21 6.9 21 11.5Z"></path></svg></span> PlingChat</div>
    <h1 id="authTitle">Que bom te ver de novo!</h1>
    <p class="auth-sub" id="authSub">Entre para conversar, chamar e jogar com a galera.</p>

    <form id="authForm" autocomplete="on">
      <label class="field" id="fieldUsername" hidden>
        <span>Nome de usuário</span>
        <input name="username" type="text" maxlength="32" autocomplete="nickname">
      </label>
      <label class="field">
        <span>E-mail</span>
        <input name="email" type="email" required autocomplete="email">
      </label>
      <label class="field">
        <span>Senha</span>
        <input name="password" type="password" required minlength="6" autocomplete="current-password">
      </label>
      <label class="field" id="fieldInvite" hidden>
        <span>Código de convite</span>
        <input name="inviteCode" type="text" autocomplete="off" placeholder="XXXXX-XXXXX">
      </label>
      <div class="turnstile" id="turnstileBox" hidden></div>
      <p class="auth-error" id="authError" hidden></p>
      <p class="auth-ok" id="authOk" hidden></p>
      <button class="btn btn-primary btn-block" id="authSubmit" type="submit">Entrar</button>
      <p class="auth-forgot" id="authForgotWrap">
        <button type="button" class="link" id="authForgot">Esqueci minha senha</button>
      </p>
    </form>

    <!-- recuperação de senha -->
    <form id="forgotForm" autocomplete="on" hidden>
      <label class="field">
        <span>E-mail da conta</span>
        <input name="email" type="email" required autocomplete="email">
      </label>
      <div class="turnstile" id="turnstileForgot" hidden></div>
      <p class="auth-error" id="forgotError" hidden></p>
      <p class="auth-ok" id="forgotOk" hidden></p>
      <button class="btn btn-primary btn-block" type="submit">Enviar link de recuperação</button>
      <p class="auth-forgot"><button type="button" class="link" id="forgotBack">Voltar para o login</button></p>
    </form>

    <!-- nova senha, vindo do link do e-mail -->
    <form id="resetForm" autocomplete="off" hidden>
      <label class="field">
        <span>Nova senha</span>
        <input name="password" type="password" required minlength="6" autocomplete="new-password">
      </label>
      <label class="field">
        <span>Confirme a nova senha</span>
        <input name="confirm" type="password" required minlength="6" autocomplete="new-password">
      </label>
      <p class="auth-error" id="resetError" hidden></p>
      <button class="btn btn-primary btn-block" type="submit">Salvar nova senha</button>
    </form>

    <div class="auth-divider" id="googleAuth" hidden>
      <span>ou</span>
      <div id="googleButton"></div>
    </div>

    <p class="auth-switch">
      <span id="authSwitchText">Precisa de uma conta?</span>
      <button type="button" id="authSwitch" class="link">Registre-se</button>
    </p>
  </div>
</div>

<!-- --------------------------------------------------------------- app -->
<div id="app" class="app" hidden>

  <!-- barra de servidores -->
  <nav class="rail">
    <div class="ws-switcher" id="wsSwitcher" hidden>
      <button class="ws-trigger" id="wsTrigger" title="Trocar de espaço">
        <span class="ws-avatar" id="wsAvatar"></span>
      </button>
      <div class="ws-menu" id="wsMenu" hidden></div>
    </div>
    <button class="rail-item rail-home active" id="railHome" title="Mensagens diretas">
      <span class="rail-glyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.5 9.5 0 0 1-2.8-.4L4 21l1.4-4.1A8.2 8.2 0 0 1 3.6 11.5C3.6 6.9 7.6 3.2 12.5 3.2S21 6.9 21 11.5Z"></path></svg></span>
      <span class="rail-pill"></span>
    </button>
    <div class="rail-sep"></div>
    <div id="railGuilds" class="rail-guilds"></div>
    <button class="rail-item rail-add" id="btnAddGuild" title="Adicionar um servidor"></button>
  </nav>

  <!-- barra lateral -->
  <aside class="sidebar">
    <header class="sidebar-header" id="sidebarHeader">
      <span id="sidebarTitle">Mensagens diretas</span>
      <span class="chev" id="guildMenuChevron" hidden>⌄</span>
    </header>

    <div class="sidebar-body" id="sidebarBody"></div>

    <!-- painel de voz ativo -->
    <div class="voice-panel" id="voicePanel" hidden>
      <div class="voice-info">
        <div class="voice-status"><span class="dot"></span> <span id="voiceStatusText">Conectado</span></div>
        <div class="voice-channel" id="voiceChannelName"></div>
      </div>
      <div class="voice-actions">
        <button class="icon-btn" id="btnScreen" title="Compartilhar tela">🖥️</button>
        <button class="icon-btn" id="btnCam" title="Câmera">📷</button>
        <button class="icon-btn danger" id="btnHangup" title="Desconectar">📞</button>
      </div>
    </div>

    <!-- painel do usuário -->
    <div class="user-panel">
      <button class="user-info" id="btnUserSettings">
        <span class="avatar" id="meAvatar"></span>
        <span class="user-text">
          <strong id="meName">—</strong>
          <small id="meTag">#0000</small>
        </span>
      </button>
      <div class="user-actions">
        <button class="icon-btn" id="btnMic" title="Microfone">🎙️</button>
        <button class="icon-btn" id="btnDeaf" title="Áudio">🎧</button>
        <button class="icon-btn" id="btnSettings" title="Configurações">⚙️</button>
      </div>
    </div>
  </aside>

  <!-- área principal -->
  <main class="main">
    <div class="verify-banner" id="verifyBanner" hidden>
      <span>Confirme seu e-mail para não perder o acesso à conta.</span>
      <button class="link" id="verifyResend">Reenviar e-mail</button>
      <button class="icon-btn" id="verifyDismiss" title="Fechar">✕</button>
    </div>
    <header class="chat-header">
      <button class="icon-btn only-mobile" id="btnBack">‹</button>
      <button class="icon-btn" id="btnNavToggle" title="Mostrar/ocultar lista de canais e DMs"></button>
      <span class="chat-title" id="chatTitle">Início</span>
      <span class="chat-topic" id="chatTopic"></span>
      <div class="chat-actions">
        <button class="icon-btn" id="btnCall" title="Chamada de voz" hidden>📞</button>
        <button class="icon-btn" id="btnVideoCall" title="Chamada de vídeo" hidden>🎥</button>
        <button class="icon-btn" id="btnBotPanel" title="Painel do bot" hidden>🤖</button>
        <button class="icon-btn" id="btnMembers" title="Membros" hidden>👥</button>
      </div>
    </header>

    <!-- palco de vídeo/tela -->
    <section class="stage" id="stage" hidden>
      <div class="stage-grid" id="stageGrid"></div>
      <div class="stage-bar">
        <button class="pill-btn" id="stageMic"><span class="pill-icon"></span><span class="pill-label">Mudo</span></button>
        <button class="pill-btn" id="stageCam"><span class="pill-icon"></span><span class="pill-label">Câmera</span></button>
        <button class="pill-btn" id="stageScreen"><span class="pill-icon"></span><span class="pill-label">Tela</span></button>
        <button class="pill-btn" id="stageFullscreen"><span class="pill-icon"></span><span class="pill-label">Tela cheia</span></button>
        <button class="pill-btn danger" id="stageLeave"><span class="pill-label">Sair</span></button>
        <button class="pill-btn ghost" id="stageCollapse"><span class="pill-label">Ocultar</span></button>
      </div>
    </section>
    <div class="stage-resize-handle" id="stageResize" title="Arraste para ajustar o tamanho da chamada"></div>

    <div class="content" id="content">
      <div class="messages" id="messages"></div>
      <div class="typing" id="typing"></div>
      <form class="composer" id="composer" hidden>
        <div class="reply-bar" id="replyBar" hidden>
          <span id="replyText"></span>
          <button type="button" class="icon-btn" id="replyCancel">✕</button>
        </div>
        <div class="composer-row">
          <button type="button" class="icon-btn" id="btnEmoji">😊</button>
          <textarea id="input" rows="1" placeholder="Conversar" maxlength="4000"></textarea>
          <button type="submit" class="icon-btn send" title="Enviar">➤</button>
        </div>
      </form>
    </div>
  </main>

  <!-- membros -->
  <aside class="members" id="membersPane" hidden>
    <div class="members-head">
      <div class="members-head-top">
        <button type="button" id="membersClose" class="icon-btn only-mobile" title="Fechar"></button>
        <strong id="membersCount">Membros</strong>
        <button type="button" id="membersInviteBtn" class="icon-btn" title="Convidar pessoas"></button>
      </div>
      <input type="text" id="membersSearch" placeholder="Buscar membro..." autocomplete="off">
    </div>
    <div id="membersList"></div>
  </aside>
</div>

<!-- áudio remoto (voz) -->
<div id="audioSink" hidden></div>

<!-- --------------------------------------------------------- modais -->
<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal" id="modal"></div>
</div>

<!-- chamada recebida -->
<div class="ring" id="ringOverlay" hidden>
  <div class="ring-card">
    <span class="avatar big" id="ringAvatar"></span>
    <h2 id="ringName">—</h2>
    <p id="ringKind">Chamada de voz</p>
    <div class="ring-actions">
      <button class="btn btn-danger" id="ringDecline">Recusar</button>
      <button class="btn btn-success" id="ringAccept">Atender</button>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script src="/vendor/socket.io.min.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
