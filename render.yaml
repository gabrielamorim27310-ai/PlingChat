# Backend do PlingChat (Socket.IO + Postgres via Supabase). Precisa de
# processo persistente (WebSocket) — por isso nao roda em plataforma
# serverless. O banco de dados fica no Supabase, entao o plano "free" do
# Render serve tranquilo: um respin/redeploy nao perde mais nenhum dado.
services:
  - type: web
    name: nexus-api
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NEXUS_SECRET
        generateValue: true
      # String de conexao do Supabase (Transaction Pooler, porta 6543 —
      # a conexao direta e IPv6-only e nao resolve no Render).
      - key: DATABASE_URL
        sync: false
      # Dominio da Vercel que pode chamar esta API, ex:
      # https://nexus.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false
      # Client ID do Google (o secret nao e usado neste fluxo)
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Cadastro por convite (padrao). Use "open" para liberar a qualquer um.
      - key: SIGNUP_MODE
        value: invite
      # Envio de e-mail: verificacao e recuperacao de senha (opcional)
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: APP_URL
        sync: false
      # Cloudflare Turnstile (opcional). Sem as duas chaves fica desligado.
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      # Notificacoes push (Web Push/VAPID). Gerado uma vez com
      # webpush.generateVAPIDKeys() — nao depende de conta externa nenhuma.
      # Sem as duas chaves, o botao de notificacao nem aparece no front.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
